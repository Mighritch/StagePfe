spring.application.name=bea-bi-backend

# ===================== DATASOURCE ORACLE =====================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:grh_dw}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:grh_dw}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===================== HIKARI =====================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DWH-HikariPool

# ===================== JPA =====================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.readOnly=true

# ===================== SERVER =====================
server.port=8081

# ===================== KEYCLOAK / OAUTH2 =====================
# URL interne utilisee par le backend pour valider les tokens JWT (serveur a serveur)
# Valeur par defaut (utilisee en local sans Docker)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/bea-realm

# URL publique de Keycloak, accessible depuis le NAVIGATEUR (utilisee par Swagger UI)
# En local sans Docker, c'est la meme URL que ci-dessus
app.keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8180/realms/bea-realm}

# ===================== SWAGGER =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8081/swagger-ui/oauth2-redirect.html
springdoc.swagger-ui.oauth-client-id=bea-bi-client
springdoc.swagger-ui.oauth-use-pkce=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ===================== ACTUATOR =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===================== LOGGING =====================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.bea=INFO