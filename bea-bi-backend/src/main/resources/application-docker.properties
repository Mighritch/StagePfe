# URL interne utilisee par le backend pour valider les tokens JWT (reseau Docker)
# Cette valeur est de toute facon surchargee par la variable d'environnement
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI definie dans docker-compose.yml
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/bea-realm

# URL publique de Keycloak, accessible depuis le NAVIGATEUR (utilisee par Swagger UI)
# Surchargee par la variable d'environnement KEYCLOAK_PUBLIC_URL dans docker-compose.yml
app.keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8080/realms/bea-realm}

spring.datasource.url=jdbc:oracle:thin:@//oracle:1521/XE

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.security=INFO
logging.level.com.bea=DEBUG
logging.level.org.springframework.web=INFO